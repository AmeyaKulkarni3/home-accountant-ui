<div class="flex flex-col mt-4">
    <app-page-header title="Dashboard" subtitle="Welcome Back" />

    <div class="space-y-4">

        <app-stat-card title="Current Balance" [value]="balance"
            icon="account_balance_wallet" />

        <div class="grid grid-cols-2 gap-4 mt-4">

            <app-stat-card title="Income" [value]="income" icon="trending_up"
                iconColor="text-income" />

            <app-stat-card title="Expense" [value]="expense" icon="trending_down"
                iconColor="text-expense" />

        </div>

    </div>
</div>
